# Configuración de Alembic.
#
# NO hay clave de URL de SQLAlchemy acá, y es deliberado. La ruta de la base la elige el
# cliente y vive en el archivo de arranque de la capa 1 (D-30), que se resuelve en tiempo
# de ejecución. Una URL versionada en el repositorio sería la ruta de la máquina de quien
# la escribió: en el mejor caso migra una base que no es la del cliente, y en el peor crea
# una base vacía en una carpeta que no existe y la migración "pasa" sin tocar nada.
# `env.py` la obtiene, en orden: del atributo que le pasa quien lo invoca de forma
# programática, de `-x ruta_db=…`, o del archivo de arranque.
#
# Hay una invariante de código que exige que la clave de URL no aparezca en este archivo.

[alembic]
script_location = src/porteria/infraestructura/persistencia/migraciones

# Los identificadores de revisión son numéricos y con ceros a la izquierda (0001, 0002…)
# porque la versión de esquema del producto ES el identificador de la revisión cabeza
# (D-35): así hay una sola verdad sobre en qué versión está la base, y ordenar
# lexicográficamente da el mismo resultado que ordenar cronológicamente.
file_template = %%(rev)s_%%(slug)s

# Rutas con separador de barra, que funciona en las tres plataformas.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = consola

[formatters]
keys = generico

[logger_root]
level = WARNING
handlers = consola
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_consola]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generico

[formatter_generico]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
